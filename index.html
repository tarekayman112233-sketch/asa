<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <!-- السطر السحري: إجبار المتصفح وكانفا على التعامل مع الصفحة كشاشة كمبيوتر 1080p -->
    <meta name="viewport" content="width=1080">
    <title>دعوة كتب كتاب | خالد وياسمين</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 1080px; height: 100vh; overflow: hidden; background: #f5f5dc; 
        }
        
        /* شاشة البداية لتشغيل الصوت */
        #start { 
            position: absolute; top: 0; left: 0; width: 1080px; height: 100vh; 
            background: #f5f5dc; display: flex; justify-content: center; align-items: center; 
            z-index: 10; cursor: pointer; 
        }
        
        /* تكبير الزرار لأن الشاشة هيتم تصغيرها تلقائياً على الموبايل */
        #start button { 
            padding: 40px 90px; font-size: 55px; font-weight: bold; font-family: Arial, sans-serif;
            background: #d4af37; color: #fff; border: none; border-radius: 60px; 
            cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        /* حاوية كانفا */
        .canva-container {
            width: 1080px;
            height: 100vh;
            position: relative;
        }
        
        /* إخفاء شريط كانفا بزيادة الطول للأسفل */
        .canva-container iframe {
            width: 1080px !important;
            height: calc(100vh + 150px) !important; 
            margin-top: -20px;
            border: none;
            position: absolute;
            top: 0; left: 0;
        }
    </style>
</head>
<body>
    <!-- شاشة البداية -->
    <div id="start" onclick="this.style.display='none'; document.getElementById('music').play()">
        <button>اضغط لفتح الدعوة</button>
    </div>
    
    <div class="canva-container">
        <!-- كود كانفا الخاص بك -->
        <iframe loading="lazy" 
            src="https://www.canva.com/design/DAHWOjn0Kh4/376KPZyaGjXg4zMsfuFB-w/view?embed" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>
    </div>

    <!-- ملف الصوت -->
    <audio id="music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
