<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta property="og:title" content="دعوة عقد قران | eee و eee">
    <meta property="og:description" content="بكل الحب والمودة نتشرف بدعوتكم">
    <title>دعوة eee و eee</title>
    <style>
        /* إعدادات الشاشة الكاملة لضمان أعلى جودة */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #f5f5dc; overflow: hidden; }
        
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #f5f5dc; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; cursor: pointer; transition: opacity 0.5s ease; }
        
        #start-btn { padding: 15px 40px; font-size: 20px; font-family: Arial, sans-serif; background-color: #d4af37; color: #fff; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        /* جعل التصميم يملأ الشاشة بدون هوامش */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <button id="start-btn">اضغط لفتح الدعوة</button>
    </div>
    
    <!-- عرض الدعوة مباشرة بكامل الشاشة -->
    <iframe src="https://www.canva.com/design/DAHWOjn0Kh4/376KPZyaGjXg4zMsfuFB-w/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.getElementById('start-screen').addEventListener('click', function() {
            document.getElementById('bg-music').play();
            this.style.opacity = '0';
            setTimeout(() => { this.style.display = 'none'; }, 500);
        });
    </script>
</body>
</html>
