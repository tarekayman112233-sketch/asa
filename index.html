<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة كتب كتاب | خالد وياسمين</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; /* يمنع أي تمرير أو هوامش بيضاء */
            background: #f5f5dc; 
        }
        
        /* شاشة البداية لتجاوز حظر الصوت */
        #start { 
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            background: #f5f5dc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 10; 
            cursor: pointer; 
        }
        
        button { 
            padding: 15px 40px; 
            font-size: 20px; 
            font-family: Arial, sans-serif;
            background: #d4af37; 
            color: #fff; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        /* إعدادات الشاشة الكاملة لإخفاء شريط كانفا */
        .canva-container { 
            width: 100%; 
            height: 100%; 
            position: relative;
        }
        
        .canva-container iframe { 
            width: 100vw !important; 
            height: calc(100vh + 60px) !important; /* زيادة الارتفاع لدفع شريط كانفا خارج الشاشة */
            margin-top: -10px; /* لضبط الحافة العلوية */
            border: none; 
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- الشاشة الترحيبية -->
    <div id="start" onclick="this.style.display='none'; document.getElementById('music').play()">
        <button>اضغط لفتح الدعوة</button>
    </div>
    
    <!-- تصميم كانفا -->
    <div class="canva-container">
        <iframe loading="lazy" 
            src="https://www.canva.com/design/DAHWOjn0Kh4/376KPZyaGjXg4zMsfuFB-w/view?embed" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>
    </div>

    <!-- ملف الصوت (تأكد من وجود أغنية بنفس هذا الاسم في الفولدر) -->
    <audio id="music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

</body>
</html>
