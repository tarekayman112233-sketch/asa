<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="دعوة كتب كتاب | rrr و rrrr">
    <meta property="og:description" content="يسعدنا مشاركتكم فرحتنا">
    <title>دعوة rrr و rrrr</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #000; display: flex; justify-content: center; align-items: center; }
        #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #f5f5dc; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; cursor: pointer; transition: opacity 0.5s ease; }
        #start-btn { padding: 15px 40px; font-size: 20px; font-family: Arial, sans-serif; background-color: #d4af37; color: #fff; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #canva-wrapper { display: none; width: 100%; max-width: 500px; height: 100%; overflow-y: auto; background: #fff; }
    </style>
</head>
<body>
    <div id="start-screen">
        <button id="start-btn">اضغط لفتح الدعوة</button>
    </div>
    
    <div id="canva-wrapper">
        <div style="position: relative; width: 100%; height: 0; padding-top: 450.2928%;
 padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
 border-radius: 8px; will-change: transform;">
  <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0;margin: 0;"
    src="https://www.canva.com/design/DAHWOjn0Kh4/376KPZyaGjXg4zMsfuFB-w/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
  </iframe>
</div>
<a href="https:&#x2F;&#x2F;www.canva.com&#x2F;design&#x2F;DAHWOjn0Kh4&#x2F;376KPZyaGjXg4zMsfuFB-w&#x2F;view?utm_content=DAHWOjn0Kh4&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener">نسخة من حفل زفاف خالد &amp; ياسمين</a> بواسطة tarek ayman
    </div>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.getElementById('start-screen').addEventListener('click', function() {
            document.getElementById('bg-music').play();
            this.style.opacity = '0';
            setTimeout(() => { this.style.display = 'none'; }, 500);
            document.getElementById('canva-wrapper').style.display = 'block';
        });
    </script>
</body>
</html>
