<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="دعوة كتب كتاب | احمد و منه">
    <meta property="og:description" content="يسعدنا مشاركتكم فرحتنا">
    <title>دعوة احمد و منه</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #f5f5dc; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; cursor: pointer; transition: opacity 0.5s ease; }
        #start-btn { padding: 15px 40px; font-size: 20px; font-family: Arial, sans-serif; background-color: #d4af37; color: #fff; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #canva-frame { width: 100%; height: 100%; border: none; display: none; }
    </style>
</head>
<body>
    <div id="start-screen">
        <button id="start-btn">اضغط لفتح الدعوة</button>
    </div>
    <iframe id="canva-frame" src="https://tdesignation1.my.canva.site/dahwojn0kh4" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    <script>
        document.getElementById('start-screen').addEventListener('click', function() {
            document.getElementById('bg-music').play();
            this.style.opacity = '0';
            setTimeout(() => { this.style.display = 'none'; }, 500);
            document.getElementById('canva-frame').style.display = 'block';
        });
    </script>
</body>
</html>
